<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型与思考深度 · 样式预览</title>
<style>
:root{color-scheme:light;--ink:#262a30;--muted:#747b85;--line:#e5e8ec;--soft:#f1f3f6;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:var(--ink);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px}button,input,textarea{font:inherit}button{border:0;background:transparent;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #9aa4b5;outline-offset:3px}.page{max-width:920px;margin:auto;padding:40px 28px 28px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.page-head h1{font-size:18px;font-weight:600;margin:0}.page-head p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.preview-label{flex-shrink:0;font-size:10px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--muted);background:var(--paper)}.workbench{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px 26px 19px;min-height:670px;display:flex;flex-direction:column}.conversation{flex:1}.message{margin:0;font-size:14px;line-height:1.9;color:#343941}.message+p{margin-top:10px;font-size:12px;color:var(--muted)}.stage{position:relative;padding-top:366px}.composer-wrap{position:relative}.composer{border:1px solid #e0e4e9;background:#fbfcfd;border-radius:14px;box-shadow:0 2px 8px #26314705;padding:15px 16px 11px}.composer textarea{display:block;width:100%;height:55px;border:0;resize:none;background:transparent;outline:0;line-height:1.8;font-size:13px;color:var(--ink)}.composer textarea::placeholder{color:#8b929c}.toolbar{display:flex;align-items:center;gap:8px;padding-top:9px}.tools{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px}.tool{display:flex;align-items:center;gap:5px}.grow{flex:1}.model-trigger,.permission-trigger{display:flex;align-items:center;gap:7px;padding:6px;border-radius:6px;font-size:11px;white-space:nowrap}.model-trigger{font-weight:600}.model-trigger:hover,.model-trigger[aria-expanded=true]{background:var(--soft)}.current-depth{font-size:10px;font-weight:400;color:var(--muted)}.permission-trigger{color:var(--muted)}.send{display:grid;place-items:center;background:#e9edf2;border-radius:50%;width:29px;height:29px;flex-shrink:0;color:#747e8d}.icon{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.chevron{width:10px;height:10px}.caption{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--muted);margin-top:12px}.menu{position:absolute;right:94px;bottom:calc(100% + 8px);width:320px;padding:9px;background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:0 14px 38px #27344918}.menu[hidden]{display:none}.menu-heading{display:flex;justify-content:space-between;align-items:center;padding:7px 10px 11px}.menu-heading strong{font-size:12px;font-weight:600}.menu-heading span{font-size:10px;color:var(--muted)}.model-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:50px;padding:9px 10px;border-radius:8px}.model-row{position:relative;cursor:pointer}.model-row input{position:absolute;width:1px;height:1px;opacity:0}.model-row:has(input:focus-visible){outline:2px solid #9aa4b5;outline-offset:1px}.model-row:hover{background:#f7f8fa}.model-row:has(input:checked){background:var(--soft)}.model-copy{flex:1;min-width:0}.model-copy strong{display:block;font-size:12px;font-weight:550}.model-copy small{display:block;font-size:10px;color:var(--muted);margin-top:3px}.check{width:15px;height:15px;visibility:hidden}.model-row:has(input:checked) .check{visibility:visible}.reasoning{margin:8px 4px 0;padding:14px 6px 3px;border-top:1px solid var(--line)}.reasoning-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.reasoning-head label{font-size:12px;font-weight:550}.depth-badge{font-size:10px;background:var(--soft);padding:4px 7px;border-radius:5px;min-width:28px;text-align:center}.reasoning p{font-size:10px;color:var(--muted);margin:0 0 13px;line-height:1.6}.range-wrap{position:relative;height:26px;display:flex;align-items:center}.ticks{position:absolute;inset:8px 5px;display:flex;justify-content:space-between;pointer-events:none}.ticks i{height:5px;width:1px;background:#b9bfc8;align-self:center}.thinking-slider{position:relative;z-index:1;appearance:none;width:100%;height:4px;margin:0;border:0;border-radius:3px;background:linear-gradient(to right,#323944 0 var(--progress,80%),#e0e4e9 var(--progress,80%) 100%);cursor:pointer}.thinking-slider::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:1.5px solid #323944;box-shadow:0 1px 3px #202c3c26}.thinking-slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:1.5px solid #323944;box-shadow:0 1px 3px #202c3c26}.range-labels{display:flex;justify-content:space-between;margin:0 -1px 13px;font-size:9px;color:#858d99}.range-labels span[data-active=true]{color:var(--ink);font-weight:600}.preview-note{border-top:1px solid var(--line);margin:10px 4px 0;padding:10px 6px 2px;font-size:10px;line-height:1.6;color:var(--muted)}.design-foot{font-size:11px;color:var(--muted);line-height:1.8;margin:16px 2px 0}
@media(max-width:600px){.page{padding:21px 12px}.page-head{align-items:flex-start;margin-bottom:18px}.page-head h1{font-size:16px}.page-head p{font-size:11px}.workbench{padding:20px 13px 17px;min-height:610px;border-radius:13px}.stage{padding-top:357px}.menu{right:0;width:min(320px,100%)}.composer{padding:12px}.toolbar{flex-wrap:wrap;gap:5px}.tools{flex-basis:100%;margin-bottom:3px}.toolbar>.grow{display:none}.model-trigger{margin-right:auto;font-size:10px;gap:5px}.permission-trigger{font-size:10px;gap:4px}.caption{font-size:9px}.caption span:last-child{white-space:nowrap}.message{font-size:12px}.design-foot{font-size:10px}.menu-heading{padding-bottom:8px}.reasoning{padding-top:12px}}
</style>
</head>
<body>
<main class="page">
 <header class="page-head"><div><h1>模型与思考深度</h1><p>输入框底部的局部样式设计</p></div><span class="preview-label">视觉预览</span></header>
 <section class="workbench" aria-label="输入框样式预览">
  <div class="conversation"><p class="message">从一个清楚的问题开始。</p><p>选择模型，再调整思考深度。</p></div>
  <div class="stage">
   <div class="composer-wrap">
   <section class="menu" id="model-menu" aria-label="模型与思考强度预览">
    <div class="menu-heading"><strong>选择模型</strong><span>当前会话</span></div>
    <div role="radiogroup" aria-label="示例模型">
     <label class="model-row"><input type="radio" name="preview-model" value="Research Pro" checked><span class="model-copy"><strong>Research Pro</strong><small>模型名称示例</small></span><svg class="icon check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></label>
     <label class="model-row"><input type="radio" name="preview-model" value="Code Light"><span class="model-copy"><strong>Code Light</strong><small>模型名称示例</small></span><svg class="icon check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></label>
    </div>
    <div class="reasoning"><div class="reasoning-head"><label for="thinking">思考强度</label><span class="depth-badge" id="depth">高</span></div><p>拖动滑动条，预览思考深度。</p><div class="range-wrap"><div class="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><input class="thinking-slider" id="thinking" type="range" min="0" max="5" step="1" value="4" aria-valuetext="高"></div><div class="range-labels" aria-hidden="true"><span>关闭</span><span>最少</span><span>低</span><span>中</span><span data-active="true">高</span><span>超高</span></div></div>
    <p class="preview-note">样式预览 · 不保存到真实会话</p>
   </section>
   <div class="composer"><textarea aria-label="输入框样式示例" placeholder="描述研究问题…"></textarea><div class="toolbar"><div class="tools"><span class="tool"><svg class="icon" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v14c0 4 14 4 14 0V5M5 12c0 4 14 4 14 0"/></svg>来源</span><span class="tool"><svg class="icon" viewBox="0 0 24 24"><path d="m9 15 7-7a3 3 0 0 0-4-4L4 12a5 5 0 0 0 7 7l8-8"/></svg>附件</span><span class="tool">○ 多智能体</span></div><div class="grow"></div><button class="model-trigger" id="trigger" type="button" aria-expanded="true" aria-controls="model-menu"><span id="model-name">Research Pro</span><span class="current-depth" id="trigger-depth">高</span><svg class="icon chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><span class="permission-trigger">变更前确认<svg class="icon chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span><span class="send" aria-label="发送按钮样式示例"><svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></span></div></div>
   </div>
   <div class="caption"><span>固定快照 · 显式审批 · 可追溯证据</span><span>Enter 发送</span></div>
  </div>
 </section>
 <p class="design-foot">这里只演示模型列表与滑动条的视觉、选中态及拖动反馈；示例名称与档位不代表真实模型支持能力。</p>
</main>
<script>
const labels=['关闭','最少','低','中','高','超高'],slider=document.querySelector('#thinking'),menu=document.querySelector('#model-menu'),trigger=document.querySelector('#trigger');
slider.addEventListener('input',()=>{const index=Number(slider.value);slider.style.setProperty('--progress',index/5*100+'%');slider.setAttribute('aria-valuetext',labels[index]);document.querySelector('#depth').textContent=labels[index];document.querySelector('#trigger-depth').textContent=labels[index];document.querySelectorAll('.range-labels span').forEach((label,i)=>label.dataset.active=String(i===index));});
document.querySelectorAll('[name=preview-model]').forEach(input=>input.addEventListener('change',()=>{document.querySelector('#model-name').textContent=input.value;}));
trigger.addEventListener('click',()=>{menu.hidden=!menu.hidden;trigger.setAttribute('aria-expanded',String(!menu.hidden));});
menu.addEventListener('keydown',event=>{if(event.key==='Escape'){menu.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();}});
</script>
</body>
</html>
