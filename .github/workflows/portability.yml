name: Feature portability
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  templates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test --test-concurrency=1 tests/integration/publication-template-library.test.mjs tests/unit/publication-template-library.test.mjs tests/unit/publication-template-ui.test.mjs tests/unit/publication-ui.test.mjs tests/unit/skill-archive.test.mjs
