name: Feature portability
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-features:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test --test-concurrency=1 tests/integration/publication-template-library.test.mjs tests/unit/publication-template-library.test.mjs tests/unit/publication-template-ui.test.mjs tests/unit/publication-ui.test.mjs tests/unit/skill-archive.test.mjs
      - run: node --test --test-concurrency=1 tests/integration/github-project.test.mjs tests/unit/github-ui.test.mjs tests/unit/session-history-ui.test.mjs
      - run: node --test --test-concurrency=1 tests/integration/runner.test.mjs tests/unit/store-startup.test.mjs
      - run: node --test --test-concurrency=1 tests/integration/local-gpu-runner.test.mjs tests/unit/execution-environments-ui.test.mjs tests/unit/scheduler-ui.test.mjs tests/unit/ssh-runner.test.mjs tests/unit/operation-schema.test.mjs
      - run: node --test --test-concurrency=1 tests/integration/data-backup.test.mjs tests/integration/data-relocation.test.mjs tests/unit/operation-outputs.test.mjs tests/unit/builtin-skill-releases.test.mjs
      - run: node --test --test-concurrency=1 tests/unit/run-scheduling.test.mjs tests/unit/github-commit-inspect.test.mjs tests/unit/research-adaptation-skills.test.mjs tests/integration/experiment-dialogue-http.test.mjs
      - run: node --test --test-concurrency=1 tests/unit/publication-image.test.mjs tests/unit/permission-actions-ui.test.mjs tests/integration/publication-image-pi-http.test.mjs tests/integration/model-http-ipc.test.mjs
      - run: node --test --test-concurrency=1 tests/unit/document-image.test.mjs tests/unit/document-image-ui.test.mjs tests/integration/document-image-pi-http.test.mjs tests/integration/operations-http-cli.test.mjs
